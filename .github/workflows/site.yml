# Build, verify, and deploy to GitHub Pages.
#
# build and verify run on every pull request and push. deploy runs on main
# only, after both pass. Actions are pinned to commit SHAs; npm packages are
# pinned exactly in package-lock.json.
#
# Tiers (DECISIONS D17, D19). build runs every cheap gate once and uploads
# dist/. verify is a matrix over browser engines, one job each, in parallel,
# all testing that one build. Pull requests: Chromium only (axe still runs in
# all three themes at both widths), and Lighthouse on the homepage. Push to
# main, the nightly schedule and a manual run: Chromium and WebKit, and
# Lighthouse on every page, before deploy. Lighthouse runs in the Chromium job
# only, at three runs per page. The scripts default to the full set locally.
name: site

on:
  pull_request:
  push:
    branches: [main]
  # Nightly rebuild so build-time snapshots (stations, network summary) stay
  # fresh between content changes (rebuild plan §4.5). 09:17 UTC is 03:17 MDT,
  # 02:17 MST, off the hour.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build and cheap gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A base path no deploy uses, so any link that ignores the base path
      # 404s in the browser pass. The deploy base comes from configure-pages.
      BASE_PATH: /verify-base/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: No hosts or base paths in source
        run: npm run check:paths
      - name: Kit pin matches the published tag (SRI, anti-flash, logo)
        run: npm run check:kit
      - name: Pages CMS config matches the content schema (DECISIONS D13)
        run: npm run check:cms
      - name: Type check
        run: npm run check
      - name: Newsletter renderer (fixture post, no network)
        run: npm run test:newsletter

      - run: npm run build
      - name: Built pages (CSP hashes, noindex, canonical, one h1, base path)
        run: npm run check:built
      - name: Redirect map (every old URL lands on a built page; no chains or loops)
        run: npm run check:redirects
      - name: Publications cache covers every listed DOI
        run: npm run check:publications
      - name: HTML validity
        run: npm run check:html

      # The verify build, at /verify-base/, for the engine jobs. Never
      # deployed: deploy builds its own from configure-pages.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  verify:
    name: Verify (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-24.04
    # One engine per job. Installs are minutes on a cold apt mirror; the
    # harness is the rest, and Lighthouse adds ~3 to the Chromium job.
    timeout-minutes: 25
    strategy:
      # Let both engines report; deploy needs both regardless.
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","webkit"]') }}
    env:
      BASE_PATH: /verify-base/
      # Read by scripts/verify.mjs: one engine per job.
      VERIFY_ENGINES: ${{ matrix.engine }}
      # Read by scripts/lighthouse.mjs.
      LH_PAGES: ${{ github.event_name == 'pull_request' && 'home' || 'all' }}
      # Three runs even on PRs: a single run scored the homepage 89 against a
      # median of 96, so one run is noise, not signal. Only the page set narrows.
      LH_RUNS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-dist
          path: dist

      # The kit's verify harness, at the tag this site pins.
      - id: kit
        run: echo "version=$(node -p "require('fs').readFileSync('src/kit/kit.ts','utf8').match(/KIT_VERSION = '([^']+)'/)[1]")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mt-climate-office/mco-web-style
          ref: v${{ steps.kit.outputs.version }}
          path: .kit
          persist-credentials: false

      # The browser and its apt .debs: cached per runner image, Playwright
      # version and engine, and installed in two timed steps so a hung
      # download or apt mirror fails fast under a name that says which. The
      # .debs are the slow half on a bad mirror (the kit's canary measured
      # 117 MB at 104 kB/s), so apt's archive directory is pointed into the
      # cache, as the kit's .github/actions/playwright does. Lighthouse uses
      # Playwright's Chromium too.
      - id: pw
        name: Playwright version
        run: |
          {
            echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
            echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.cache/apt-archives/partial"
          echo "Dir::Cache::Archives \"$HOME/.cache/apt-archives/\";" | sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null
      - name: Restore Playwright browser and apt packages
        id: pwcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          # One engine per key, so the key never holds a comma. A PR shares
          # main's cache for the same engine.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-${{ matrix.engine }}
      - name: Install browser (${{ matrix.engine }})
        timeout-minutes: 5
        run: npx playwright install ${{ matrix.engine }}
      - name: Install browser system dependencies (apt)
        # 8 min once the apt cache is warm; 15 on a miss, so a slow mirror can
        # finish once and warm it (the cache is saved only after a full install).
        timeout-minutes: ${{ steps.pwcache.outputs.cache-hit == 'true' && 8 || 15 }}
        run: |
          npx playwright install-deps ${{ matrix.engine }}
          sudo chmod -R a+rX "$HOME/.cache/apt-archives"
      # Saved right after the install, not in a post step, so a later check
      # failure still leaves a warm cache for the rerun.
      - name: Save Playwright browser and apt packages
        if: steps.pwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          key: ${{ steps.pwcache.outputs.cache-primary-key }}

      - name: Kit gates (head, lint-css, axe × 3 themes × 2 widths, keyboard; ${{ matrix.engine }})
        run: npm run verify
        env:
          KIT_DIR: .kit
      - name: Lighthouse budgets (accessibility 100, performance ≥ 90 mobile, homepage JS < 150 KB; ${{ env.LH_PAGES }} × ${{ env.LH_RUNS }})
        if: matrix.engine == 'chromium'
        run: npm run lighthouse

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Every engine must pass. deploy builds its own dist/ for the production
    # origin and base path; the verify artifact is built at /verify-base/.
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Origin and base path come from the repo's Pages settings: the
      # project-pages URL now, the custom domain once one is set there.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm run build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # Production is indexable (cutover, rebuild plan Phase 5 step 17;
      # docs/cutover-checklist.md D4). Fails a build that is still noindex,
      # or whose robots.txt or sitemap.xml is not the production one.
      - name: Built pages are indexable
        run: npm run check:built
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPECT_INDEXABLE: '1'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
