# Build, verify, and deploy to GitHub Pages.
#
# verify runs on every pull request and push. deploy runs on main only, after
# verify passes. Actions are pinned to commit SHAs; npm packages are pinned
# exactly in package-lock.json.
#
# Tiers (DECISIONS D17). Pull requests: every cheap gate, the kit harness in
# Chromium only (axe still runs in all three themes at both widths), and
# Lighthouse on the homepage, one run. Push to main, the nightly schedule and
# a manual run: the full set, Chromium and WebKit, Lighthouse on every page at
# three runs, before deploy. The scripts default to the full set locally.
name: site

on:
  pull_request:
  push:
    branches: [main]
  # Nightly rebuild so build-time snapshots (stations, network summary) stay
  # fresh between content changes (rebuild plan §4.5). 09:17 UTC is 03:17 MDT,
  # 02:17 MST, off the hour.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A base path no deploy uses, so any link that ignores the base path
      # 404s in the browser pass. The deploy base comes from configure-pages.
      BASE_PATH: /verify-base/
      # D17 tiers, read by scripts/verify.mjs and scripts/lighthouse.mjs.
      VERIFY_ENGINES: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium,webkit' }}
      LH_PAGES: ${{ github.event_name == 'pull_request' && 'home' || 'all' }}
      # Three runs even on PRs: a single run scored the homepage 89 against a
      # median of 96, so one run is noise, not signal. Only the page set narrows.
      LH_RUNS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: No hosts or base paths in source
        run: npm run check:paths
      - name: Kit pin matches the published tag (SRI, anti-flash, logo)
        run: npm run check:kit
      - name: Type check
        run: npm run check
      - name: Newsletter renderer (fixture post, no network)
        run: npm run test:newsletter

      - run: npm run build
      - name: Built pages (CSP hashes, noindex, canonical, one h1, base path)
        run: npm run check:built
      - name: HTML validity
        run: npm run check:html

      # The kit's verify harness, at the tag this site pins.
      - id: kit
        run: echo "version=$(node -p "require('fs').readFileSync('src/kit/kit.ts','utf8').match(/KIT_VERSION = '([^']+)'/)[1]")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mt-climate-office/mco-web-style
          ref: v${{ steps.kit.outputs.version }}
          path: .kit
          persist-credentials: false

      # Browsers and their apt .debs: cached per runner image, Playwright
      # version and engine set, and installed in two timed steps so a hung
      # download or apt mirror fails fast under a name that says which. The
      # .debs are the slow half on a bad mirror (the kit's canary measured
      # 117 MB at 104 kB/s), so apt's archive directory is pointed into the
      # cache, as the kit's .github/actions/playwright does. Lighthouse uses
      # Playwright's Chromium too.
      - id: pw
        name: Playwright version and engines
        run: |
          # Cache keys cannot contain commas, so the key uses "chromium-webkit".
          {
            echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
            echo "engines=${VERIFY_ENGINES//,/ }"
            echo "engines_key=${VERIFY_ENGINES//,/-}"
            echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.cache/apt-archives/partial"
          echo "Dir::Cache::Archives \"$HOME/.cache/apt-archives/\";" | sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null
      - name: Restore Playwright browsers and apt packages
        id: pwcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-${{ steps.pw.outputs.engines_key }}
          # A PR can start from main's full cache; install adds nothing it has.
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-
      - name: Install browsers (${{ steps.pw.outputs.engines }})
        timeout-minutes: 5
        run: npx playwright install ${{ steps.pw.outputs.engines }}
      - name: Install browser system dependencies (apt)
        # 8 min once the apt cache is warm; 25 on a miss, so a slow mirror can
        # finish once and warm it (the cache is saved only after a full install).
        timeout-minutes: ${{ steps.pwcache.outputs.cache-hit == 'true' && 8 || 25 }}
        run: |
          npx playwright install-deps ${{ steps.pw.outputs.engines }}
          sudo chmod -R a+rX "$HOME/.cache/apt-archives"
      # Saved right after the install, not in a post step, so a later check
      # failure still leaves a warm cache for the rerun.
      - name: Save Playwright browsers and apt packages
        if: steps.pwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          key: ${{ steps.pwcache.outputs.cache-primary-key }}

      - name: Kit gates (head, lint-css, axe × 3 themes × 2 widths, keyboard; ${{ env.VERIFY_ENGINES }})
        run: npm run verify
        env:
          KIT_DIR: .kit
      - name: Lighthouse budgets (accessibility 100, performance ≥ 90 mobile, homepage JS < 150 KB; ${{ env.LH_PAGES }} × ${{ env.LH_RUNS }})
        run: npm run lighthouse

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Origin and base path come from the repo's Pages settings: the
      # project-pages URL now, the custom domain once one is set there.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm run build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # Fails a build that lost noindex. At cutover (rebuild plan Phase 5,
      # step 17) set EXPECT_INDEXABLE: '1' here, deliberately, in the same
      # change that moves the domain.
      - name: Built pages are noindex
        run: npm run check:built
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPECT_INDEXABLE: '0'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
